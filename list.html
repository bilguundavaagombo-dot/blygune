<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F8F9FB">

    <title>AMT - Жорууд</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* --- CORE VARIABLES --- */
        :root { 
            --bg: #F8F9FB; 
            --text: #1F2937; 
            --sub-text: #6B7280; 
            --accent: #FF4500; 
            --accent-grad: linear-gradient(135deg, #FF4500 0%, #FF8C00 100%); 
            --border: #E5E7EB; 
            --card-bg: rgba(255, 255, 255, 0.7); 
            --surface: #FFFFFF; 
            --radius: 24px; 
            --font: 'Inter', sans-serif; 
            --font-head: 'Playfair Display', serif; 
            --shadow: 0 15px 40px -10px rgba(0,0,0,0.08); 
            --glass: blur(14px); 
        }
        [data-theme="dark"] { 
            --bg: #0F1115; 
            --text: #F9FAFB; 
            --sub-text: #9CA3AF; 
            --accent: #FF5722; 
            --accent-grad: linear-gradient(135deg, #FF5722 0%, #FF9800 100%); 
            --border: #1F2937; 
            --card-bg: rgba(31, 41, 55, 0.6); 
            --surface: #1A202C; 
            --shadow: 0 15px 40px -10px rgba(0,0,0,0.4); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: var(--font); 
            min-height: 100vh; 
            overflow-x: hidden; 
            display: flex; 
            flex-direction: column; 
            transition: background 0.3s, color 0.3s; 
            padding-bottom: 40px;
        }

        /* --- MOBILE ZOOM --- */
        @media only screen and (max-width: 768px) { 
            body { zoom: 65%; } 
            main { padding-top: 100px !important; }
        }

        /* --- HEADER --- */
        header { 
            padding: 20px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: fixed; 
            top: 0; left: 0; width: 100%; z-index: 100; 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: var(--glass); 
            -webkit-backdrop-filter: var(--glass); 
            border-bottom: 1px solid var(--border); 
        }
        .logo-group { cursor: pointer; display: flex; flex-direction: column; line-height: 1; }
        .logo { font-family: var(--font-head); font-weight: 900; font-size: 2rem; letter-spacing: -1px; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-sub { font-family: 'Inter', sans-serif; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-top: 5px; color: var(--text); opacity: 0.8; }
        .theme-btn { width: 45px; height: 45px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; cursor: pointer; color: var(--text); transition: 0.3s; box-shadow: var(--shadow); }
        .theme-btn:hover { transform: rotate(20deg); border-color: var(--accent); color: var(--accent); }

        /* --- MAIN LAYOUT --- */
        main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 120px 20px 60px 20px; 
            max-width: 1000px; 
            margin: 0 auto; 
            width: 100%; 
        }

        .hero { text-align: center; margin-bottom: 50px; width: 100%; max-width: 600px; animation: fadeIn 0.8s ease; }
        .hero h1 { 
            font-family: var(--font-head); 
            font-size: 3rem; 
            margin-bottom: 15px; 
            line-height: 1.1;
            font-weight: 900; 
        }
        .hero p { font-size: 1.1rem; color: var(--sub-text); line-height: 1.6; }

        .back-btn { 
            align-self: flex-start; 
            background: none; 
            border: none; 
            font-size: 1rem; 
            color: var(--sub-text); 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-weight: 700; 
            margin-bottom: 20px; 
            padding: 10px 0;
            transition: 0.2s;
        }
        .back-btn:hover { color: var(--accent); transform: translateX(-5px); }

        /* --- RECIPE CARDS --- */
        #recipe-list-container { width: 100%; display: flex; flex-direction: column; gap: 20px; }
        
        .recipe-card { 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: var(--radius); 
            padding: 30px; 
            width: 100%; 
            cursor: pointer; 
            transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            position: relative; 
            overflow: hidden; 
            box-shadow: var(--shadow);
        }
        .recipe-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        
        .rc-title { font-weight: 900; font-size: 1.4rem; margin-bottom: 10px; font-family: var(--font-head); line-height: 1.2; }
        .rc-desc { color: var(--sub-text); font-size: 1rem; line-height: 1.5; margin-bottom: 15px; max-width: 90%; }
        
        .rc-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .rc-badge { font-size: 0.85rem; padding: 8px 14px; border-radius: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
        .rc-cal { background: rgba(255, 69, 0, 0.1); color: var(--accent); }
        .rc-time { background: var(--border); color: var(--text); }
        .rc-health { background: var(--surface); border: 1px solid var(--border); color: var(--sub-text); }
        
        .rc-arrow { 
            position: absolute; right: 30px; top: 50%; transform: translateY(-50%); 
            color: var(--border); font-weight: 900; font-size: 2rem; transition: 0.3s;
        }
        .recipe-card:hover .rc-arrow { color: var(--accent); transform: translate(5px, -50%); }

        /* --- FIXED LOADER SCREEN (Android Fix) --- */
        .loader-screen { 
            display: flex; 
            position: fixed; 
            /* Force full screen using inset 0 */
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            width: 100%; 
            height: 100dvh; /* Dynamic Height for Mobile Address Bars */
            background: var(--bg); 
            z-index: 9999; /* High Z-Index */
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 40px;
            /* Hardware Acceleration */
            -webkit-transform: translate3d(0,0,0);
            transform: translate3d(0,0,0);
        }
        
        .loader-screen.hidden { display: none; }
        
        .spinner { 
            font-size: 4rem; 
            animation: spin 1.5s infinite linear; 
            display: block; 
            margin-bottom: 25px; 
            /* Anti-Jitter */
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
        }
        
        .loader-title { font-family: var(--font-head); font-size: 1.8rem; font-weight: 900; margin-bottom: 10px; }
        .loader-tip { 
            margin-top: 40px; padding: 20px 30px; 
            background: var(--surface); border: 1px solid var(--accent); 
            color: var(--text); border-radius: 20px; 
            font-size: 1rem; max-width: 500px; line-height: 1.6; 
            font-style: italic; animation: fadeIn 0.5s ease; box-shadow: var(--shadow);
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <header>
        <div class="logo-group" onclick="window.location.href='index.html'">
            <div class="logo">AMT<span>.</span></div>
            <div class="logo-sub">Action • Method • Technique</div>
        </div>
        <button class="theme-btn" onclick="toggleTheme()">◑</button>
    </header>

    <div class="loader-screen" id="loader-screen">
        <span class="spinner">🥘</span>
        <h2 class="loader-title">Цэс боловсруулж байна...</h2>
        <p style="color:var(--sub-text);">Түр хүлээнэ үү</p>
        <div class="loader-tip" id="loader-tip">💡 Зөвлөгөө: Махаа шарахын өмнө тасалгааны хэмд 20 минут байлгавал шүүслэг болдог.</div>
    </div>

    <main id="main-content" style="display:none;">
        <button class="back-btn" onclick="window.location.href='index.html'">← Буцах</button>
        <div class="hero">
            <h1>Танд зориулсан жорууд</h1>
            <p>Таны оруулсан орцонд тулгуурлан хиймэл оюун ухааны санал болгож буй 5 сонголт.</p>
        </div>
        <div id="recipe-list-container"></div>
    </main>

    <script>
        const lvlNames = ["Анхан", "Сурагч", "Дундаж", "Сайн", "Pro"];
        
        const loadingTips = [
            "💡 Зөвлөгөө: Махаа шарахын өмнө тасалгааны хэмд 20 минут байлгавал илүү шүүслэг болдог.",
            "💡 Зөвлөгөө: Гоймон чанахдаа усандаа давс хангалттай хийвэл амт нь илүү тодорно.",
            "💡 Зөвлөгөө: Шөл давстай болчихвол түүхий төмс хийж хэсэг буцалгаарай.",
            "💡 Зөвлөгөө: Өндөг чанахдаа усанд нь халбага уксус хийвэл хальслахад амархан.",
            "💡 Зөвлөгөө: Ногоогоо хэт болгохгүйн тулд буцалж буй уснаас гаргаад шууд мөстэй усанд сой.",
            "💡 Зөвлөгөө: Сармисны хальсыг амархан арилгахын тулд хутганы хажуугаар зөөлөн дар."
        ];

        window.onload = () => {
            if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
            rotateTips(); 
            generateList();
        };

        function toggleTheme() { 
            const d = document.body.getAttribute('data-theme') === 'dark'; 
            document.body.setAttribute('data-theme', d ? 'light' : 'dark'); 
            localStorage.setItem('theme', d ? 'light' : 'dark'); 
        }

        function rotateTips() {
            const tipEl = document.getElementById('loader-tip');
            let i = Math.floor(Math.random() * loadingTips.length);
            tipEl.innerText = loadingTips[i];
            setInterval(() => {
                i = (i + 1) % loadingTips.length;
                tipEl.innerText = loadingTips[i];
            }, 8000); 
        }

        async function generateList() {
            const state = JSON.parse(localStorage.getItem('amt_state'));
            if(!state) {
                window.location.href = 'index.html';
                return;
            }

            // --- STRICT "FAST RECIPE" LOGIC ---
            let moodInstruction = "";
            
            if (state.mode === 'easy') {
                moodInstruction = "STRICTLY FAST FOOD. Maximum 20 minutes cooking time. Stir-frys, Salads, Quick Soups, Sandwiches. NO baking, NO slow cooking, NO stewing.";
            } else {
                moodInstruction = "Gourmet, Impressive, Delicious. Restaurant Quality.";
            }

            const promptText = `
            Role: Elite Mongolian Chef.
            Language: Native Mongolian (Cyrillic).
            Task: Create 5 distinct recipe ideas based on these inputs.

            USER SETTINGS:
            - Mood/Type: ${moodInstruction} (CRITICAL!)
            - Ingredients: ${state.ings.join(', ')} (PLUS: ${state.activePantry.join(', ')})
            - Diet: ${state.diet.join(', ')}
            - Servings: ${state.servings}

            STRICT RULES:
            1. Use ONLY provided ingredients if possible.
            2. If "FAST" mode is selected, recipes MUST be very quick (e.g. Хуурга, Салат, Шөл).
            3. Output strictly JSON.

            OUTPUT FORMAT (JSON ARRAY):
            [
                {
                    "title": "Recipe Name (Mongolian)", 
                    "desc": "Short appetizing description (Max 12 words).",
                    "cal": "Calories (e.g. 450 ккал)",
                    "time": "Time (e.g. 15 мин)",
                    "health": "Benefit (e.g. Өндөр уураг)"
                }
            ]
            `;

            try {
                // Ensure this matches your API Endpoint in index.html
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });
                const data = await response.json();
                
                if (data.output) { 
                    let raw = data.output;
                    if(data.candidates) raw = data.candidates[0].content.parts[0].text; 
                    
                    raw = raw.replace(/```json/g, '').replace(/```/g, '').trim();
                    const recipes = JSON.parse(raw);
                    renderRecipeList(recipes);
                    document.getElementById('loader-screen').classList.add('hidden');
                    document.getElementById('main-content').style.display = 'flex';
                }
            } catch (err) {
                console.error(err);
                // Demo dummy data
                const dummy = [
                    {title: "Үхрийн махан хуурга", desc: "Хурдан болдог, амттай сонгодог жор.", cal: "450 ккал", time: "20 мин", health: "Уураг их"},
                    {title: "Ногоотой шөл", desc: "Энгийн орцоор хийх боломжтой эрүүл шөл.", cal: "320 ккал", time: "15 мин", health: "Витаминлаг"}
                ];
                renderRecipeList(dummy);
                document.getElementById('loader-screen').classList.add('hidden');
                document.getElementById('main-content').style.display = 'flex';
            }
        }

        function renderRecipeList(recipes) {
            const container = document.getElementById('recipe-list-container');
            container.innerHTML = '';
            recipes.forEach(r => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                card.innerHTML = `
                    <div class="rc-title">${r.title}</div>
                    <div class="rc-meta">
                        <span class="rc-badge rc-time">⏱️ ${r.time}</span>
                        <span class="rc-badge rc-cal">🔥 ${r.cal}</span>
                        <span class="rc-badge rc-health">🌿 ${r.health}</span>
                    </div>
                    <div class="rc-desc">${r.desc}</div>
                    <div class="rc-arrow">→</div>
                `;
                card.onclick = () => {
                    localStorage.setItem('amt_selected_recipe', r.title);
                    window.location.href = 'detail.html';
                };
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
