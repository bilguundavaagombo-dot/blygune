<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F8F9FB">
    <title>AMT - Жор</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* --- ӨНГӨНИЙ ТӨЛӨВЛӨЛТ --- */
        :root { 
            --bg: #F8F9FB; 
            --text: #1F2937; 
            --sub-text: #4B5563; 
            --accent: #FF4500; 
            --accent-grad: linear-gradient(135deg, #FF4500 0%, #FF8C00 100%); 
            --border: #E5E7EB; 
            --surface: #FFFFFF; 
            --radius: 24px; 
            --font: 'Inter', sans-serif; 
            --font-head: 'Playfair Display', serif; 
            --shadow: 0 10px 30px -5px rgba(0,0,0,0.1); 
        }
        [data-theme="dark"] { 
            --bg: #0F1115; 
            --text: #F9FAFB; 
            --sub-text: #9CA3AF; 
            --accent: #FF5722; 
            --border: #374151; 
            --surface: #1F2937; 
            --shadow: 0 10px 30px -5px rgba(0,0,0,0.5); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--bg); color: var(--text); font-family: var(--font); 
            min-height: 100vh; display: flex; flex-direction: column; 
            transition: background 0.3s, color 0.3s;
        }

        /* --- ТОЛГОЙ ХЭСЭГ --- */
        header { 
            padding: 20px 30px; 
            display: flex; justify-content: space-between; align-items: center; 
            position: fixed; top: 0; left: 0; width: 100%; z-index: 100; 
            background: rgba(255,255,255,0.01); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
        }
        .logo { font-family: var(--font-head); font-weight: 900; font-size: 1.8rem; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); font-size: 1.2rem; cursor: pointer; color: var(--text); display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        
        /* --- ГОЛ ХЭСЭГ --- */
        main { 
            flex: 1; padding: 100px 20px 40px 20px; 
            width: 100%; max-width: 800px; margin: 0 auto; 
        }

        .back-btn { 
            background: none; border: none; font-size: 1rem; color: var(--sub-text); 
            cursor: pointer; display: flex; align-items: center; gap: 8px; 
            font-weight: 600; margin-bottom: 20px; transition: 0.2s; 
        }
        .back-btn:hover { color: var(--accent); transform: translateX(-5px); }

        .recipe-header-group { text-align: center; margin-bottom: 30px; }
        .recipe-title { 
            font-size: 2.2rem; font-family: var(--font-head); font-weight: 900; 
            color: var(--text); line-height: 1.2; margin-bottom: 10px; 
        }
        .skill-tag { 
            display: inline-block; padding: 5px 12px; background: var(--surface); 
            border: 1px solid var(--accent); color: var(--accent); 
            border-radius: 20px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; 
        }

        /* --- ЖОРНЫ КАРТ (MODERN ELEGANCE) --- */
        .recipe-card { 
            background: var(--surface); border-radius: var(--radius); 
            border: 1px solid var(--border); overflow: hidden; 
            box-shadow: var(--shadow); animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .recipe-image-wrapper {
            width: 100%; height: 300px; background: #e5e7eb; position: relative; overflow: hidden;
        }
        .recipe-image {
            width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease;
        }
        .recipe-image:hover { transform: scale(1.03); }

        .recipe-content { padding: 30px; }
        
        .recipe-desc { font-style: italic; color: var(--sub-text); margin-bottom: 30px; line-height: 1.6; border-left: 3px solid var(--accent); padding-left: 15px; }

        .section-title { 
            font-family: var(--font-head); font-size: 1.4rem; font-weight: 800; 
            color: var(--text); margin: 30px 0 15px 0; display: flex; align-items: center; gap: 10px;
        }
        .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); margin-left: 10px; }

        ul.ingredients-list { list-style: none; padding: 0; }
        ul.ingredients-list li { 
            padding: 10px 0; border-bottom: 1px dashed var(--border); 
            color: var(--text); font-size: 1.05rem; display: flex; align-items: center; gap: 10px;
        }
        ul.ingredients-list li::before { content: "•"; color: var(--accent); font-size: 1.5rem; line-height: 0; }

        ol.steps-list { counter-reset: step; padding: 0; list-style: none; }
        ol.steps-list li { position: relative; padding-left: 45px; margin-bottom: 20px; color: var(--sub-text); line-height: 1.7; font-size: 1.05rem; }
        ol.steps-list li::before { 
            counter-increment: step; content: counter(step); 
            position: absolute; left: 0; top: 0; 
            width: 32px; height: 32px; background: var(--accent); 
            color: white; border-radius: 50%; text-align: center; 
            line-height: 32px; font-weight: bold; font-size: 0.9rem; 
        }

        /* --- LOADER --- */
        .loader-overlay { 
            position: fixed; inset: 0; background: var(--bg); z-index: 999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 40px; text-align: center; 
        }
        .loader-overlay.hidden { display: none; }
        .spinner { font-size: 3rem; animation: spin 1s infinite linear; margin-bottom: 20px; display: block; }
        .loader-text { font-family: var(--font-head); font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; }
        
        .tip-box { 
            margin-top: 30px; padding: 20px; background: var(--surface); 
            border: 1px solid var(--border); border-radius: 16px; 
            max-width: 400px; font-size: 0.95rem; line-height: 1.5; color: var(--sub-text);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <div class="logo">AMT.</div>
        <button class="icon-btn" onclick="toggleTheme()">◑</button>
    </header>

    <div class="loader-overlay" id="loader">
        <span class="spinner">🥘</span>
        <div class="loader-text">Ухаалаг жор бодож байна...</div>
        <p style="color:var(--sub-text)">Түр хүлээнэ үү</p>
        <div class="tip-box" id="random-tip">💡 Зөвлөгөө: Махаа шарахаас өмнө тасалгааны хэмд байлгавал илүү шүүслэг болдог.</div>
    </div>

    <main id="main-content" style="display:none;">
        <button class="back-btn" onclick="window.history.back()">← Буцах</button>
        
        <div class="recipe-header-group">
            <span class="skill-tag" id="skill-display">Түвшин: Дундаж</span>
            <h1 class="recipe-title" id="page-title">Жор бэлдэж байна...</h1>
        </div>

        <div id="recipe-container"></div>
    </main>

    <script>
        // --- DATA & SETUP ---
        const lvlNames = ["Анхан", "Сурагч", "Дундаж", "Сайн", "Pro"];
        const tips = [
            "💡 Зөвлөгөө: Шөл давстай болчихвол түүхий төмс хийж хэсэг буцалгаарай.",
            "💡 Зөвлөгөө: Сонгино хэрчихдээ хүйтэн усаар хутгаа норговол нүд cayхгүй.",
            "💡 Зөвлөгөө: Өндөг чанахдаа усанд нь халбага уксус хийвэл хальслахад амархан.",
            "💡 Зөвлөгөө: Махаа шарахаас өмнө хуурай болтол нь арчвал сайн шарагдана."
        ];

        window.onload = () => {
            // Theme Check
            if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
            
            // Random Tip
            document.getElementById('random-tip').innerText = tips[Math.floor(Math.random() * tips.length)];
            
            // Start Generation
            generateRecipe();
        };

        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // --- CORE GENERATION LOGIC ---
        async function generateRecipe() {
            // 1. Get User Data
            const state = JSON.parse(localStorage.getItem('amt_state'));
            
            // If no data (direct access), redirect back
            if (!state) {
                window.location.href = 'index.html'; // Change to your input page
                return;
            }

            const skillName = lvlNames[state.skill - 1] || "Дундаж";
            document.getElementById('skill-display').innerText = "Түвшин: " + skillName;

            // 2. Construct the Prompt (The Brain)
            // We ask AI to output HTML directly so we can just inject it.
            // Using Pollinations.ai for dynamic images based on English keywords.
            
            const prompt = `
            Role: Expert Mongolian Chef.
            Task: Create ONE detailed recipe based on these ingredients: ${state.ings.join(', ')} (Pantry items available: ${state.activePantry ? state.activePantry.join(', ') : 'Basic spices'}).
            
            Strict Output Format: HTML Code Only (No markdown code blocks, just the <div>).
            
            Language: Mongolian (Cyrillic). Natural, appetizing, fluent phrasing. NOT robotic.
            
            Structure Required:
            <div class="recipe-card">
                <div class="recipe-image-wrapper">
                    <img src="https://image.pollinations.ai/prompt/photorealistic delicious {EnglishDishName}?nologo=true" class="recipe-image" alt="Food">
                </div>
                <div class="recipe-content">
                    <div class="recipe-desc">{A short, mouth-watering description of the dish in Mongolian.}</div>
                    
                    <div class="section-title">Орц</div>
                    <ul class="ingredients-list">
                        <li>{Ingredient 1}</li>
                        <li>{Ingredient 2}</li>
                        ...
                    </ul>

                    <div class="section-title">Хийх дараалал</div>
                    <ol class="steps-list">
                        <li>{Step 1 - detailed}</li>
                        <li>{Step 2 - detailed}</li>
                        ...
                    </ol>
                </div>
            </div>

            Constraints:
            1. Title must be in Mongolian inside the logic (I will set it separately, but you focus on the card content).
            2. The Image URL MUST contain the English translation of the dish name for the AI generator to work.
            3. Do NOT include <html>, <head>, or <body> tags. Just the .recipe-card div.
            `;

            try {
                // 3. Call API (Replace with your actual endpoint)
                // Note: Since I cannot call a real backend here, I will simulate the success behavior 
                // using the Fallback logic below. In your real website, uncomment the fetch part.
                
                /*
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                const data = await response.json();
                const htmlContent = data.output; // Assuming your API returns { output: "html string" }
                */

                // --- SIMULATED AI RESPONSE (FALLBACK FOR DEMO) ---
                // This is what the AI *would* return based on the prompt above.
                // It generates a different image based on the ingredients provided.
                
                const mainIng = state.ings.length > 0 ? state.ings[0] : "Хоол";
                // Simple translation hack for demo image (In real API, AI does this translation)
                const engName = mainIng === "Өндөг" ? "Egg dish" : (mainIng === "Мах" ? "Steak" : "Delicious Food");
                
                const simulatedAIResponse = `
                <div class="recipe-card">
                    <div class="recipe-image-wrapper">
                        <img src="https://image.pollinations.ai/prompt/photorealistic delicious ${engName} dish professional food photography?nologo=true" class="recipe-image" alt="Food">
                    </div>
                    <div class="recipe-content">
                        <h2 style="font-family: var(--font-head); font-size: 2rem; margin-bottom: 10px;">${mainIng}-тэй Амтат Хуурга</h2>
                        <div class="recipe-desc">Энэхүү жор нь ${mainIng}-ыг ашиглан гэрийн нөхцөлд хийж болох хамгийн амттай, өег хувилбар юм. Таны оруулсан орцуудад тулгуурлан энэхүү жорыг санал болгож байна.</div>
                        
                        <div class="section-title">Орц</div>
                        <ul class="ingredients-list">
                            <li>${mainIng} - 300гр</li>
                            <li>Сонгино - 1 ширхэг</li>
                            <li>Сармис - 2 хумс</li>
                            <li>Давс, перц - Амталгаагаар</li>
                            ${state.ings.slice(1).map(i => `<li>${i} - Хүссэн хэмжээгээр</li>`).join('')}
                        </ul>

                        <div class="section-title">Хийх дараалал</div>
                        <ol class="steps-list">
                            <li>Эхлээд бүх ногоо болон үндсэн орцоо угааж, жигд хэмжээтэй хэрчиж бэлтгэнэ.</li>
                            <li>Хайруулын тавгаа дунд зэргийн гал дээр халааж, ургамлын тосоо хийнэ. Тос халмогц ${mainIng}-аа хийж шаргал өнгөтэй болтол нь хуурна.</li>
                            <li>Дараа нь сонгино, сармисаа нэмж үнэрийг нь гартал 2-3 минут хамт хуурна.</li>
                            <li>Үлдсэн ногоонуудаа нэмж, зөөлөртөл нь таглаж жигнэнэ. Энэ үед давс, перцээр амтална.</li>
                            <li>Бэлэн болсон хоолыг таваглаад, хүсвэл ногоон сонгиноор чимэглэн халуунаар нь зооглоорой.</li>
                        </ol>
                    </div>
                </div>
                `;

                // 4. Render
                // Simulate network delay for realism
                setTimeout(() => {
                    document.getElementById('page-title').style.display = 'none'; // Hide default title as card has it
                    document.getElementById('recipe-container').innerHTML = simulatedAIResponse;
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('main-content').style.display = 'block';
                }, 2000);

            } catch (err) {
                console.error("Error:", err);
                alert("Уучлаарай, алдаа гарлаа. Дахин оролдоно уу.");
            }
        }
    </script>
</body>
</html>
