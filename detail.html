<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F8F9FB">

    <title>AMT - Дэлгэрэнгүй</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* --- CORE VARIABLES --- */
        :root { 
            --bg: #F8F9FB; 
            --text: #1F2937; 
            --sub-text: #6B7280; 
            --accent: #FF4500; 
            --accent-grad: linear-gradient(135deg, #FF4500 0%, #FF8C00 100%); 
            --border: #E5E7EB; 
            --input-bg: #FFFFFF; 
            --surface: #FFFFFF; 
            --radius: 24px; 
            --font: 'Inter', sans-serif; 
            --font-head: 'Playfair Display', serif; 
            --shadow: 0 15px 40px -10px rgba(0,0,0,0.08); 
            --glass: blur(14px); 
        }
        [data-theme="dark"] { 
            --bg: #0F1115; 
            --text: #F3F4F6; 
            --sub-text: #9CA3AF; 
            --accent: #FF5722; 
            --accent-grad: linear-gradient(135deg, #FF5722 0%, #FF9800 100%); 
            --border: #2D3748; 
            --input-bg: #1A202C; 
            --surface: #1A202C; 
            --shadow: 0 15px 40px -10px rgba(0,0,0,0.4); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: var(--font); 
            min-height: 100vh; 
            overflow-x: hidden; 
            transition: background 0.3s, color 0.3s; 
            padding-bottom: 60px; 
            display: flex;
            flex-direction: column;
        }

        @media only screen and (max-width: 768px) { 
            body { zoom: 65%; } 
            main { padding-top: 100px !important; }
        }

        /* --- HEADER --- */
        header { 
            padding: 20px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: fixed; 
            top: 0; left: 0; width: 100%; z-index: 100; 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: var(--glass); 
            -webkit-backdrop-filter: var(--glass); 
            border-bottom: 1px solid var(--border); 
        }
        .logo-group { cursor: pointer; display: flex; flex-direction: column; line-height: 1; }
        .logo { font-family: var(--font-head); font-weight: 900; font-size: 2rem; letter-spacing: -1px; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-sub { font-family: 'Inter', sans-serif; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-top: 5px; color: var(--text); opacity: 0.8; }
        .icon-btn { width: 45px; height: 45px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); font-size: 1.4rem; cursor: pointer; color: var(--text); transition: 0.3s; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
        
        main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 120px 20px 60px 20px; 
            max-width: 900px; 
            margin: 0 auto; 
            width: 100%; 
        }

        .back-btn { 
            align-self: flex-start; 
            background: none; 
            border: none; 
            font-size: 1rem; 
            color: var(--sub-text); 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-weight: 700; 
            margin-bottom: 30px; 
            padding: 10px 0;
            transition: 0.2s;
        }
        .back-btn:hover { color: var(--accent); transform: translateX(-5px); }
        
        .detail-header { width: 100%; margin-bottom: 30px; text-align: center; animation: fadeIn 0.8s ease; }
        .detail-title { 
            font-size: 3rem; 
            font-family: var(--font-head); 
            font-weight: 900; 
            color: var(--text); 
            line-height: 1.1; 
            margin-bottom: 15px; 
            background: var(--accent-grad); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        
        .skill-badge { 
            display: inline-flex; 
            padding: 8px 18px; 
            background: var(--surface); 
            border: 1px solid var(--accent); 
            border-radius: 50px; 
            font-size: 0.9rem; 
            font-weight: 700; 
            color: var(--accent); 
            margin-bottom: 15px; 
            box-shadow: 0 5px 15px rgba(255, 69, 0, 0.15); 
        }

        .detail-content { 
            width: 100%; 
            background: var(--surface); 
            padding: 40px; 
            border-radius: var(--radius); 
            border: 1px solid var(--border); 
            line-height: 1.8; 
            font-size: 1.15rem; 
            box-shadow: var(--shadow); 
            animation: fadeIn 1s ease;
        }
        
        .detail-content h3 { 
            color: var(--text); 
            margin: 35px 0 20px 0; 
            font-size: 1.5rem; 
            border-bottom: 2px solid var(--border); 
            padding-bottom: 10px; 
            font-family: var(--font-head); 
            font-weight: 900;
        }
        .detail-content h3:first-child { margin-top: 0; }
        
        .detail-content ul, .detail-content ol { padding-left: 25px; margin-bottom: 25px; }
        .detail-content li { margin-bottom: 12px; color: var(--text); }
        .detail-content strong { color: var(--text); font-weight: 800; }
        .detail-content p { margin-bottom: 20px; color: var(--sub-text); }

        /* --- FIXED LOADER SCREEN (Android Fix) --- */
        .loader-screen { 
            display: flex; 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; /* Use all 4 coordinates to force full screen */
            width: 100%; 
            height: 100dvh; /* Dynamic Viewport Height for Android Address Bar */
            background: var(--bg); 
            z-index: 9999; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 40px;
            /* Force Hardware Acceleration for Smoothness */
            -webkit-transform: translate3d(0,0,0);
            transform: translate3d(0,0,0);
        }
        
        .loader-screen.hidden { display: none; }
        
        .spinner { 
            font-size: 4rem; 
            animation: spin 1.5s infinite linear; /* Linear is smoother for spinning */
            display: block; 
            margin-bottom: 25px; 
            /* Prevent Jitter */
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
        }
        
        .loader-title { font-family: var(--font-head); font-size: 1.8rem; font-weight: 900; margin-bottom: 10px; }
        
        .loader-tip { 
            margin-top: 40px; padding: 20px 30px; 
            background: var(--surface); border: 1px solid var(--accent); 
            color: var(--text); border-radius: 20px; 
            font-size: 1rem; max-width: 500px; line-height: 1.6; 
            font-style: italic; animation: fadeIn 0.5s ease; box-shadow: var(--shadow);
        }

        .btn-donate { 
            width: 100%; 
            margin-top: 40px; 
            padding: 22px; 
            border-radius: var(--radius); 
            border: none; 
            background: #22C55E; 
            color: white; 
            font-size: 1.2rem; 
            font-weight: 800; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            box-shadow: 0 15px 30px rgba(34, 197, 94, 0.25); 
            transition: 0.3s; 
        }
        .btn-donate:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(34, 197, 94, 0.35); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); z-index: 1100; opacity: 0; pointer-events: none; transition: 0.3s; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { width: 100%; max-width: 500px; background: var(--bg); border-radius: 30px; padding: 40px; transform: scale(0.9); opacity: 0; transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid var(--border); text-align: center; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); }
        .modal-overlay.active .modal-card { transform: scale(1); opacity: 1; }
        
        .donate-title { font-size: 1.8rem; font-family: var(--font-head); font-weight: 900; margin-bottom: 15px; color: var(--text); }
        .donate-text { color: var(--sub-text); font-size: 1rem; margin-bottom: 30px; line-height: 1.6; }
        
        .pay-card { background: var(--surface); padding: 25px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; text-align: left; }
        .pay-header { display: flex; justify-content: space-between; align-items: center; }
        .pay-logo { font-weight: 900; color: var(--text); font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        .pay-logo.golomt { color: #00AEEF; }
        
        .account-box { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 15px; border-radius: 14px; border: 1px dashed var(--sub-text); }
        .acc-number { font-family: monospace; font-size: 1.3rem; font-weight: 700; color: var(--text); letter-spacing: 1px; }
        .btn-copy { background: var(--text); color: var(--bg); border: none; padding: 10px 20px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-copy:active { transform: scale(0.95); opacity: 0.8; }
        
        .btn-close-donate { background: var(--border); color: var(--text); border: none; padding: 18px 40px; border-radius: 50px; font-weight: 800; cursor: pointer; margin-top: 10px; width: 100%; font-size: 1rem; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <header>
        <div class="logo-group" onclick="window.location.href='index.html'">
            <div class="logo">AMT<span>.</span></div>
            <div class="logo-sub">Action • Method • Technique</div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleTheme()">◑</button>
        </div>
    </header>

    <div class="loader-screen" id="loader-screen">
        <span class="spinner">🥘</span>
        <h2 class="loader-title">Зааврыг бэлдэж байна...</h2>
        <p style="color:var(--sub-text);">Түр хүлээнэ үү</p>
        <div class="loader-tip" id="loader-tip">💡 Зөвлөгөө: Махаа шарахын өмнө тасалгааны хэмд 20 минут байлгавал шүүслэг болдог.</div>
    </div>

    <main id="main-content" style="display:none;">
        <button class="back-btn" onclick="window.location.href='list.html'">← Буцах</button>
        
        <div class="detail-header">
            <div id="skill-display" class="skill-badge"></div>
            <h1 class="detail-title" id="recipe-title"></h1>
        </div>
        
        <div id="detail-container" class="detail-content"></div>

        <button class="btn-donate" onclick="openDonate()">
            <span>☕ Төсөл дэмжих</span>
        </button>
    </main>

    <div class="modal-overlay" id="donate-modal" onclick="closeDonate(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="donate-title">Таны дэмжлэг</div>
            <p class="donate-text">Хэрэв танд энэ аппликейшн таалагдсан бол хөгжүүлэлтийг дэмжээрэй. Баярлалаа! ❤️</p>
            
            <div class="pay-card">
                <div class="pay-header">
                    <span class="pay-logo golomt">🏦 ГОЛОМТ БАНК</span>
                </div>
                <div class="account-box">
                    <span class="acc-number" id="golomt-acc">660015001105185957</span>
                    <button class="btn-copy" onclick="copyText('660015001105185957', this)">ХУУЛАХ</button>
                </div>
            </div>

            <button class="btn-close-donate" onclick="closeDonate()">Хаах</button>
        </div>
    </div>

    <script>
        const lvlNames = ["Анхан", "Сурагч", "Дундаж", "Сайн", "Pro"];
        
        const loadingTips = [
            "💡 Зөвлөгөө: Махаа шарахын өмнө тасалгааны хэмд 20 минут байлгавал илүү шүүслэг болдог.",
            "💡 Зөвлөгөө: Гоймон чанахдаа усандаа давс хангалттай хийвэл амт нь илүү тодорно.",
            "💡 Зөвлөгөө: Сонгино хэрчихдээ хүйтэн усаар хутгаа норговол нүд cayхгүй.",
            "💡 Зөвлөгөө: Шөл давстай болчихвол түүхий төмс хийж хэсэг буцалгаарай.",
            "💡 Зөвлөгөө: Өндөг чанахдаа усанд нь халбага уксус хийвэл хальслахад амархан.",
            "💡 Зөвлөгөө: Ногоогоо хэт болгохгүйн тулд буцалж буй уснаас гаргаад шууд мөстэй усанд сой.",
            "💡 Зөвлөгөө: Сармисны хальсыг амархан арилгахын тулд хутганы хажуугаар зөөлөн дар."
        ];

        window.onload = () => {
            if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
            rotateTips();
            getFullRecipe();
        };

        function toggleTheme() { 
            const d = document.body.getAttribute('data-theme') === 'dark'; 
            document.body.setAttribute('data-theme', d ? 'light' : 'dark'); 
            localStorage.setItem('theme', d ? 'light' : 'dark'); 
        }

        function rotateTips() {
            const tipEl = document.getElementById('loader-tip');
            let i = Math.floor(Math.random() * loadingTips.length);
            tipEl.innerText = loadingTips[i];
            setInterval(() => {
                i = (i + 1) % loadingTips.length;
                tipEl.innerText = loadingTips[i];
            }, 8000); 
        }

        function openDonate() { document.getElementById('donate-modal').classList.add('active'); }
        function closeDonate(e) { if (e && e.target !== e.currentTarget) return; document.getElementById('donate-modal').classList.remove('active'); }
        
        function copyText(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = "ХУУЛСАН!";
                btnElement.style.background = "#22C55E";
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.style.background = "var(--text)";
                }, 2000);
            });
        }

        async function getFullRecipe() {
            const state = JSON.parse(localStorage.getItem('amt_state'));
            const title = localStorage.getItem('amt_selected_recipe');
            
            if(!state || !title) {
                window.location.href = 'index.html';
                return;
            }

            const skillName = lvlNames[state.skill-1];
            
            document.getElementById('recipe-title').innerText = title;
            document.getElementById('skill-display').innerText = "Түвшин: " + skillName;

            let guideType = "";
            if (state.skill <= 2) {
                guideType = "DETAILED & INSTRUCTIVE. Explain steps clearly for a beginner. Explain cuts and timings carefully.";
            } else if (state.skill >= 4) {
                guideType = "CONCISE & PROFESSIONAL. Use chef shorthand. Assume they know how to chop.";
            } else {
                guideType = "NORMAL HOME COOK STYLE. Balanced length. Clear and direct.";
            }

            const promptText = `
            Role: Native Mongolian Home Cook.
            Task: Write a recipe for "${title}".
            
            USER CONTEXT:
            - Ingredients: ${state.ings.join(', ')} (PLUS: ${state.activePantry.join(', ')})
            - Servings: ${state.servings}
            - User Skill: ${skillName} (${guideType})

            RULES:
            1. **LENGTH:** Normal length. Not too short, not a novel.
            2. **STYLE:** ${guideType}
            3. **LANGUAGE:** NATIVE Mongolian (Cyrillic). Natural phrasing.
            4. **CONTENT:** Only Ingredients and Steps. No Tools section.

            OUTPUT FORMAT (HTML ONLY):
            <h3>Орц</h3>
            <ul>...</ul>
            <h3>Хийх арга</h3>
            <ol>
               <li>Step 1...</li>
               <li>Step 2...</li>
            </ol>
            <strong>💡 Зөвлөгөө:</strong> (Short sentence)
            `;

            try {
                // Ensure this matches your API Endpoint in index.html
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });
                const data = await response.json();
                
                if (data.output) {
                    let html = data.output;
                    if(data.candidates) html = data.candidates[0].content.parts[0].text; 
                    html = html.replace(/```html/g, '').replace(/```/g, '');
                    document.getElementById('detail-container').innerHTML = html;
                    document.getElementById('loader-screen').classList.add('hidden');
                    document.getElementById('main-content').style.display = 'flex';
                }
            } catch (err) {
                console.error(err);
                 // Fallback
                 document.getElementById('detail-container').innerHTML = `
                    <h3>Орц</h3>
                    <ul><li>Жишээ орц 1</li><li>Жишээ орц 2</li></ul>
                    <h3>Хийх арга</h3>
                    <ol><li>Жишээ алхам 1...</li><li>Жишээ алхам 2...</li></ol>
                    <strong>💡 Зөвлөгөө:</strong> Ачаалахад алдаа гарлаа.
                 `;
                 document.getElementById('loader-screen').classList.add('hidden');
                 document.getElementById('main-content').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
